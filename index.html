    <script>
        let appState = { totalXp: 0, currentLevel: 1, badges: {}, journal: {}, tasks: [], habits: [], water: { goal: 2000, days: {} }, tickTimes: {}, energy: {}, distractions: [], procrastination: [], focus: [], stacks: [], plans: [], rules: [], wins: {}, balance: {}, reviews: {}, ba: { before: '', beforeDate: '', after: '', afterDate: '' }, goal: { ticks: 0, deadline: '' }, restDays: [], habitMins: {}, habitPrio: {}, plan: { avail: 120 }, goals: [], values: [], experiments: [], automations: [], kb: [], audits: {}, feedback: [] };
        
        const defaultHabits = [
            { id: '1', name: 'Wake Up Early', completed: false, history: {} },
            { id: '2', name: 'Make Your Bed', completed: false, history: {} },
            { id: '3', name: 'Morning Walk', completed: false, history: {} },
            { id: '4', name: 'Daily Workout', completed: false, history: {} },
            { id: '5', name: 'Eat Enough Protein', completed: false, history: {} },
            { id: '6', name: 'Learn a New Skill', completed: false, history: {} }
        ];

        const ICON_TRASH = '<svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
        const ICON_EDIT = '<svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
        const $ = id => document.getElementById(id);
        const pad2 = n => String(n).padStart(2, '0');
        const escapeHtml = str => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        const WEEKDAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const WEEKDAY_ORDER = [1, 2, 3, 4, 5, 6, 0];

        function getTodayStr() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
        function dateAdd(dateStr, n) { const [y, m, d] = dateStr.split('-').map(Number); const dt = new Date(y, m - 1, d + n); return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`; }
        function dateParts(str) { const [y, m, d] = str.split('-').map(Number); return { y, m, d }; }
        function weekdayOf(str) { const t = dateParts(str); return new Date(t.y, t.m - 1, t.d).getDay(); }
        function daysBetween(a, b) {
            const pa = dateParts(a), pb = dateParts(b);
            const utcA = Date.UTC(pa.y, pa.m - 1, pa.d);
            const utcB = Date.UTC(pb.y, pb.m - 1, pb.d);
            return Math.round((utcB - utcA) / 86400000);
        }
        function formatTaskDate(str) { const t = dateParts(str); return new Date(t.y, t.m - 1, t.d).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }); }

        function changePage(pageId, element) {
            document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            
            document.querySelectorAll('.nav-item, .mobile-nav-item').forEach(n => n.classList.remove('active'));
            if(element) element.classList.add('active');
            else {
                document.querySelectorAll('.mobile-nav-item').forEach(n => { if(n.dataset.pages === pageId) n.classList.add('active'); });
                document.querySelectorAll('.sidebar .nav-item').forEach(n => { if(n.innerText.toLowerCase().includes(pageId.substring(0,4))) n.classList.add('active'); });
            }
            
            window.scrollTo(0,0);
            if(pageId === 'water') renderWaterAll();
            if(pageId === 'tasks') renderTasksPage();
            if(pageId === 'settings') renderSettings();
            if(pageId === 'habits') renderHabits();
            if(pageId === 'journal') renderJournal();
            if(pageId === 'achievements') { renderBadges(); renderLevelRoadmap(); }
        }

        // ================= LEVEL SYSTEM =================
        const LEVEL_THRESHOLDS = [1000, 1400, 2000, 3200, 5000, 7000, 9500, 12500, 16000, 20000, 25000, 30000, 36000, 43000, 50000];
        const RANKS = ['Beginner', 'Starter', 'Explorer', 'Achiever', 'Warrior', 'Champion', 'Hero', 'Master', 'Grandmaster', 'Legend'];
        function getRank(l) { return RANKS[l - 1] || 'Mythic'; }
        function getLevelInfo(xp) {
            let c = 0; while (c < LEVEL_THRESHOLDS.length - 1 && xp >= LEVEL_THRESHOLDS[c]) c++;
            const start = c > 0 ? LEVEL_THRESHOLDS[c - 1] : 0, end = LEVEL_THRESHOLDS[c];
            return { level: c + 1, percent: Math.min(100, Math.round(((xp - start) / (end - start)) * 100)), remaining: Math.max(end - xp, 0) };
        }
        function checkLevelUp() {
            const info = getLevelInfo(appState.totalXp);
            if (info.level > (appState.highestLevel || 1)) {
                appState.highestLevel = info.level;
                showLevelUp(info.level);
            }
        }
        function showLevelUp(newLevel) {
            $('levelUpSub').innerText = `Level ${newLevel - 1} complete`;
            $('levelUpBadge').innerText = newLevel;
            $('levelUpRank').innerText = `You are now Level ${newLevel} - ${getRank(newLevel)}`;
            $('levelUpOverlay').classList.add('show');
            setTimeout(() => playSound('levelup'), 350);
        }
        function closeLevelUp() { $('levelUpOverlay').classList.remove('show'); }
        function renderLevelRoadmap() {
            const box = $('levelRoadmap'); if(!box) return;
            const info = getLevelInfo(appState.totalXp);
            let html = '';
            for (let n = 1; n <= 10; n++) {
                const state = n < info.level ? 'done' : (n === info.level ? 'current' : 'locked');
                html += `<div class="level-card ${state}"><div class="lv-num">LEVEL ${n}</div><div class="lv-rank">${getRank(n)}</div><div class="lv-xp">At ${LEVEL_THRESHOLDS[n-1]} XP</div><div class="lv-status">${state === 'done' ? 'Completed' : state === 'current' ? info.percent + '%' : 'Locked'}</div></div>`;
            }
            box.innerHTML = html;
        }

        // ================= SOUND SYSTEM =================
        let audioCtx = null;
        const SOUND_LIB = {
            pop: () => { tone(700, 0, 0.07, 'sine', 0.2); tone(1050, 0.04, 0.12, 'triangle', 0.14); },
            chime: () => { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.4, 'triangle', 0.17)); },
            levelup: () => { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * 0.11, 0.3, 'square', 0.07)); },
            drop: () => { tone(1300, 0, 0.09, 'sine', 0.2, 520); tone(760, 0.09, 0.18, 'sine', 0.13, 380); }
        };
        function getAudioCtx() { if (!audioCtx) { const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; audioCtx = new AC(); } if (audioCtx.state === 'suspended') audioCtx.resume(); return audioCtx; }
        function tone(freq, start, dur, type, vol) {
            const ctx = getAudioCtx(); if (!ctx) return;
            const osc = ctx.createOscillator(), gain = ctx.createGain(), t0 = ctx.currentTime + start;
            osc.type = type; osc.frequency.setValueAtTime(freq, t0);
            gain.gain.setValueAtTime(0.0001, t0); gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(t0); osc.stop(t0 + dur + 0.05);
        }
        function playSound(name) { try { if(SOUND_LIB[name]) SOUND_LIB[name](); } catch(e) {} }

        // ================= UI RENDERING =================
        function updateUI() {
            const lv = getLevelInfo(appState.totalXp);
            $('userLevelDisplay').innerText = lv.level;
            $('userRankDisplay').innerText = getRank(lv.level);
            $('totalXpDisplay').innerText = appState.totalXp;
            $('xpProgressBar').style.width = lv.percent + '%';
            $('levelInfoText').innerText = `Level ${lv.level} - ${getRank(lv.level)}`;
            $('nextLevelXpText').innerText = `${appState.totalXp} / ${LEVEL_THRESHOLDS[lv.level - 1]} XP`;
            $('streakDisplay').innerText = appState.streak || 1;
            
            const todaySched = appState.habits.filter(h => !h.days || !h.days.length || h.days.includes(weekdayOf(getTodayStr())));
            const completed = todaySched.filter(h => h.completed).length;
            $('habitsCompletedDisplay').innerText = `${completed}/${todaySched.length}`;
            $('totalCompletedDisplay').innerText = appState.habits.reduce((n, h) => n + Object.values(h.history).filter(v => v === true).length, 0);
            
            const pct = todaySched.length === 0 ? 0 : Math.round((completed/todaySched.length)*100);
            $('progressText').innerText = pct + '%';
            $('progressRing').style.strokeDashoffset = 440 - ((pct/100)*440);
            $('progressMessage').innerText = pct === 100 ? "Perfect Day!" : pct > 50 ? "Halfway there!" : "Let's build momentum!";
        }

        function renderHabits() {
            const c = $('habitList'); if(!c) return;
            c.innerHTML = '';
            appState.habits.forEach(h => {
                const sched = !h.days || !h.days.length || h.days.includes(weekdayOf(getTodayStr()));
                const row = document.createElement('div');
                row.className = `habit-row ${h.completed ? 'completed' : ''}`;
                row.setAttribute('data-habit-id', h.id);
                row.innerHTML = `<div class="custom-checkbox ${h.completed ? 'checked' : ''}" onclick="toggleHabit('${h.id}')">${h.completed ? '✓' : ''}</div>
                    <div class="habit-info"><h3>${escapeHtml(h.name)}</h3></div>
                    <div class="habit-actions"><button class="action-btn btn-delete" onclick="deleteHabit('${h.id}')">${ICON_TRASH}</button></div>`;
                c.appendChild(row);
            });
            renderCalendar();
        }

        function toggleHabit(id) {
            const h = appState.habits.find(x => x.id === id); if(!h) return;
            h.completed = !h.completed;
            h.history[getTodayStr()] = h.completed;
            appState.totalXp += h.completed ? 5 : -5;
            
            // Fix: update only specific row
            const row = document.querySelector(`.habit-row[data-habit-id="${id}"]`);
            if (row) {
                row.classList.toggle('completed', h.completed);
                const cb = row.querySelector('.custom-checkbox');
                if (cb) { cb.classList.toggle('checked', h.completed); cb.innerText = h.completed ? '✓' : ''; }
            }
            
            checkLevelUp(); saveData(); updateUI(); renderCalendar();
            playSound(h.completed ? 'pop' : 'drop');
        }

        function deleteHabit(id) { appState.habits = appState.habits.filter(h => h.id !== id); saveData(); renderHabits(); updateUI(); }

        function openModal() { $('modalTitle').innerText = "Create New Habit"; $('editHabitId').value = ""; $('habitNameInput').value = ""; $('habitModal').classList.add('show'); }
        function closeModal() { $('habitModal').classList.remove('show'); }
        function saveHabit() {
            const n = $('habitNameInput').value.trim(); if(!n) return;
            appState.habits.push({ id: Date.now().toString(), name: n, completed: false, history: {} });
            saveData(); renderHabits(); updateUI(); closeModal();
        }

        function renderCalendar() {
            const grid = $('calendarGrid'); if(!grid) return;
            grid.innerHTML = '';
            const today = new Date(), year = today.getFullYear(), month = today.getMonth(), daysInMonth = new Date(year, month + 1, 0).getDate(), todayStr = getTodayStr();
            grid.innerHTML += `<div class="cal-header-cell" style="text-align: left;">Habit</div>`;
            for (let i = 1; i <= daysInMonth; i++) {
                const d = `${year}-${pad2(month + 1)}-${pad2(i)}`;
                grid.innerHTML += `<div class="cal-header-cell ${d === todayStr ? 'today' : ''}">${i}</div>`;
            }
            appState.habits.forEach(h => {
                grid.innerHTML += `<div class="cal-habit-name">${escapeHtml(h.name)}</div>`;
                for (let i = 1; i <= daysInMonth; i++) {
                    const d = `${year}-${pad2(month + 1)}-${pad2(i)}`;
                    const isComp = h.history[d] === true, isT = d === todayStr, isMissed = !isComp && d <= todayStr;
                    grid.innerHTML += `<div class="cal-cell ${isComp ? 'completed' : ''} ${isMissed ? 'missed' : ''} ${isT ? 'today' : ''}"></div>`;
                }
            });
            renderWeeklyChart(); renderMonthlyChart();
        }

        function renderWeeklyChart() {
            const box = $('weeklyBars'); if(!box) return; box.innerHTML = '';
            const t = getTodayStr(), start = dateAdd(t, -((weekdayOf(t) + 6) % 7));
            ['M','T','W','T','F','S','S'].forEach((n, i) => {
                const d = dateAdd(start, i);
                const comp = appState.habits.filter(h => h.history[d]).length;
                const pct = appState.habits.length ? Math.round((comp/appState.habits.length)*100) : 0;
                box.innerHTML += `<div class="bar-wrapper"><div class="bar ${d===t?'active':''}" style="height:${Math.max(pct,5)}%"></div><div class="bar-label">${n}</div></div>`;
            });
        }
        function renderMonthlyChart() {
            const box = $('monthlyBars'); if(!box) return; box.innerHTML = `<div class="task-empty">Coming soon</div>`;
        }

        // ================= TASKS =================
        function openTaskModal() { $('taskModal').classList.add('show'); }
        function closeTaskModal() { $('taskModal').classList.remove('show'); }
        function saveTask() {
            const n = $('taskTitleInput').value.trim(); if(!n) return;
            appState.tasks.push({ id: Date.now().toString(), title: n, type: 'once', date: getTodayStr(), done: {}, prio: 2 });
            saveData(); closeTaskModal(); $('taskTitleInput').value = ''; renderTasksPage();
        }
        function renderTasksPage() {
            const c = $('tasksContent'); if(!c) return;
            c.innerHTML = appState.tasks.length ? appState.tasks.map(t => `<div class="habit-row"><div class="habit-info"><h3>${escapeHtml(t.title)}</h3></div></div>`).join('') : '<div class="task-empty">No tasks yet.</div>';
        }

        // ================= WATER TRACKER =================
        let drinkPending = 0;
        function addWater(ml) {
            if(!appState.water.days[getTodayStr()]) appState.water.days[getTodayStr()] = { entries: [], goal: appState.water.goal, celebrated: false };
            const day = appState.water.days[getTodayStr()];
            day.entries.push({ id: Date.now().toString(), t: `${pad2(new Date().getHours())}:${pad2(new Date().getMinutes())}`, ml });
            saveData(); renderWaterAll(); playSound('drop');
        }
        function addCustomWater() { const v = parseInt($('waterCustom').value); if(v>0) { addWater(v); $('waterCustom').value=''; } }
        function undoWater() { const day = appState.water.days[getTodayStr()]; if(day && day.entries.length) { day.entries.pop(); saveData(); renderWaterAll(); } }
        function renderWaterAll() {
            const d = appState.water.days[getTodayStr()] || { entries: [], goal: appState.water.goal };
            const tot = d.entries.reduce((n, e) => n + e.ml, 0), goal = d.goal || 2000;
            const pct = Math.min(100, Math.round((tot / goal) * 100));
            
            if($('wBar')) $('wBar').style.width = pct + '%';
            if($('wConsumed')) $('wConsumed').innerText = tot + ' ml';
            if($('wGoal')) $('wGoal').innerText = goal + ' ml';
            if($('wLeft')) $('wLeft').innerText = Math.max(0, goal - tot) + ' ml';
            if($('wPct')) $('wPct').innerText = pct + '%';
            if($('wcBar')) $('wcBar').style.width = pct + '%';
            if($('wcText')) $('wcText').innerText = `${tot} / ${goal} ml`;
            if($('wcPct')) $('wcPct').innerText = pct + '%';
            
            if($('waterLevel')) {
                $('waterLevel').style.transform = `translateY(${(482 - pct * 4.72).toFixed(1)}px)`;
                $('bodyPct').innerText = pct + '%';
                $('bodyMl').innerText = tot + ' ml';
            }
            if($('waterLog')) {
                $('waterLog').innerHTML = d.entries.length ? d.entries.slice().reverse().map(e => `<div class="sound-row"><div>+${e.ml} ml at ${e.t}</div></div>`).join('') : '<div class="task-empty">No water logged yet.</div>';
            }
        }

        // ================= JOURNAL =================
        let journalMood = '';
        function selectMood(m) { journalMood = m; document.querySelectorAll('#moodRow .mood-btn').forEach(b => b.classList.toggle('selected', b.dataset.mood === m)); }
        function renderJournal() {
            $('journalDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            const h = $('journalHistory');
            const keys = Object.keys(appState.journal || {}).sort().reverse();
            h.innerHTML = keys.length ? keys.map(k => `<div class="journal-entry"><div class="journal-entry-date">${formatTaskDate(k.slice(0,10))}</div><div>${escapeHtml(appState.journal[k].text)}</div></div>`).join('') : '<div class="task-empty">No notes saved.</div>';
        }
        function saveJournal() {
            const txt = $('journalDay').value.trim(); if(!txt) return;
            appState.journal[getTodayStr() + '~' + Date.now()] = { text: txt, mood: journalMood };
            saveData(); renderJournal(); $('journalDay').value = ''; notify({type:'success', title:'Note saved'});
        }

        // ================= BADGES =================
        function renderBadges() {
            const g = $('badgesGrid'); if(!g) return;
            const b = [
                { n: 'First Step', d: 'Tick first habit', i: 'rocket' },
                { n: 'On Fire', d: '7 day streak', i: 'flame' },
                { n: 'Centurion', d: '100 habits', i: 'award' }
            ];
            g.innerHTML = b.map(x => `<div class="bd-card unlocked"><div class="bd-title">${x.n}</div><div class="bd-desc">${x.d}</div></div>`).join('');
        }

        // ================= SETTINGS =================
        function renderSettings() {
            renderAppearance();
            $('soundSettingsPanel').innerHTML = `<h2 class="panel-title">Settings</h2><p class="setting-desc">More settings coming soon.</p>`;
            $('notifySettingsPanel').innerHTML = '';
            $('prefsPanel').innerHTML = '';
            $('securityPanel').innerHTML = '';
            $('extraPanel').innerHTML = '';
        }

        const THEMES = [{id:'dark', name:'Night'}, {id:'light', name:'Day'}, {id:'ocean', name:'Ocean'}, {id:'forest', name:'Forest'}];
        function renderAppearance() {
            const box = $('appearancePanel'); if(!box) return;
            const cur = localStorage.getItem('quantumTheme') || 'dark';
            box.innerHTML = `<h2 class="panel-title" style="margin-bottom: 14px;">Appearance</h2><div class="theme-grid">${THEMES.map(t => `<div class="theme-card ${cur===t.id?'selected':''}" onclick="setTheme('${t.id}')"><div class="theme-sw" style="background:${t.id==='light'?'#f4f5f7':'#000'}"></div><div class="theme-name">${t.name}</div></div>`).join('')}</div>`;
        }
        function setTheme(id) {
            localStorage.setItem('quantumTheme', id);
            if(id === 'light') document.documentElement.setAttribute('data-theme', 'light');
            else document.documentElement.removeAttribute('data-theme');
            renderAppearance();
        }

        // ================= UTILS =================
        function saveData() { try { localStorage.setItem('quantumHabitDataV1', JSON.stringify(appState)); } catch(e) {} }
        function notify(opts) {
            const stack = $('notifyStack'); if(!stack) return;
            const el = document.createElement('div'); el.className = 'notify';
            el.innerHTML = `<div class="notify-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M13 2L4.5 13h6L10 22l8.5-11h-6L13 2z"/></svg></div><div><div class="notify-title">${opts.title}</div><div class="notify-msg">${opts.message || ''}</div></div>`;
            stack.appendChild(el); setTimeout(() => el.remove(), 4000);
        }

        // ================= INIT =================
        function init() {
            $('currentDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            const saved = localStorage.getItem('quantumHabitDataV1');
            if(saved) { try { appState = Object.assign(appState, JSON.parse(saved)); } catch(e) {} } 
            else { appState.habits = JSON.parse(JSON.stringify(defaultHabits)); }
            
            if(!appState.water) appState.water = { goal: 2000, days: {} };
            if(!appState.tasks) appState.tasks = [];
            if(!appState.journal) appState.journal = {};
            
            renderHabits(); updateUI(); renderWaterAll(); renderTasksPage();

            setTimeout(() => {
                const splash = $('splash-screen');
                if(splash) { splash.classList.add('hidden'); setTimeout(() => splash.remove(), 500); }
            }, 800);

            if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
                window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
            }
        }

        window.onload = init;
    </script>
</body>
</html>
