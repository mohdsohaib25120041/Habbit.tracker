<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Habit Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-box input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        .input-box input:focus {
            border-color: #4CAF50;
        }

        .input-box button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-box button:hover {
            background: #45a049;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        li {
            display: flex;
            align-items: center;
            background: #2a2a2a;
            padding: 12px 15px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        li:hover {
            background: #333;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid #555;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            margin-right: 15px;
            transition: all 0.2s;
            color: transparent;
            font-size: 14px;
            font-weight: bold;
        }

        .checkbox.checked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
        }

        .habit-text {
            flex: 1;
            font-size: 15px;
            transition: color 0.3s;
        }

        .habit-text.completed {
            text-decoration: line-through;
            color: #888;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #ff5252;
        }

        .empty-state {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My Daily Habits</h1>
        
        <div class="input-box">
            <input type="text" id="habitInput" placeholder="e.g. Drink 2L Water..." onkeypress="handleKeyPress(event)">
            <button onclick="addHabit()">Add</button>
        </div>

        <ul id="habitList">
            <!-- Habits will appear here -->
        </ul>
        
        <div id="emptyState" class="empty-state">No habits added yet. Start by adding one above!</div>
    </div>

    <script>
        // Load habits from local storage
        let habits = JSON.parse(localStorage.getItem('simpleHabits')) || [];

        // Function to display habits on screen
        function renderHabits() {
            const list = document.getElementById('habitList');
            const emptyState = document.getElementById('emptyState');
            list.innerHTML = '';

            if (habits.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
            }

            habits.forEach((habit, index) => {
                const li = document.createElement('li');
                
                li.innerHTML = `
                    <div class="checkbox ${habit.completed ? 'checked' : ''}" onclick="toggleHabit(${index})">
                        ✓
                    </div>
                    <span class="habit-text ${habit.completed ? 'completed' : ''}">${habit.name}</span>
                    <button class="delete-btn" onclick="deleteHabit(${index})">🗑️</button>
                `;
                
                list.appendChild(li);
            });
        }

        // Function to add a new habit
        function addHabit() {
            const input = document.getElementById('habitInput');
            const habitName = input.value.trim();

            if (habitName === '') {
                alert('Please enter a habit!');
                return;
            }

            habits.push({ name: habitName, completed: false });
            input.value = '';
            
            saveAndRender();
        }

        // Function to toggle tick (complete/incomplete)
        function toggleHabit(index) {
            habits[index].completed = !habits[index].completed;
            saveAndRender();
        }

        // Function to delete a habit
        function deleteHabit(index) {
            habits.splice(index, 1);
            saveAndRender();
        }

        // Save to local storage and re-render
        function saveAndRender() {
            localStorage.setItem('simpleHabits', JSON.stringify(habits));
            renderHabits();
        }

        // Add habit when pressing "Enter" key
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                addHabit();
            }
        }

        // Initial render on page load
        renderHabits();
    </script>
</body>
</html>
